<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EEFD" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE502" />
      <stop offset="100%" stop-color="#FDA702" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#070B14" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#00EEFD" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Speed Lines -->
  <path d="M4 25h10M6 31h12M4 37h8" stroke="#00EEFD" stroke-width="2.5" stroke-linecap="round" />

  <!-- Phone Body -->
  <g transform="rotate(7 36 34)">
    <!-- Phone Shadow / Outer Shell -->
    <rect x="23" y="10" width="28" height="46" rx="7" fill="#011846" stroke="#05BFF4" stroke-width="1.5" />
    <!-- Phone Screen -->
    <rect x="26" y="14" width="22" height="38" rx="4" fill="url(#screenGrad)" />
    <!-- Notch -->
    <rect x="33" y="14" width="8" height="2" rx="1" fill="#011846" />
    <!-- Lightning Bolt -->
    <path d="M38 18L31 31h7l-3 14 11-16h-7l4-11z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>

  <!-- Spark Rays -->
  <line x1="50" y1="13" x2="56" y2="8" stroke="#FDA702" stroke-width="2.5" stroke-linecap="round" />
  <line x1="56" y1="19" x2="62" y2="17" stroke="#FDA702" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="8" x2="50" y2="2" stroke="#FDA702" stroke-width="2.5" stroke-linecap="round" />
</svg>